<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#cfd8dc}canvas{display:block}</style></head>
<body><canvas id="c" width="1200" height="1000"></canvas>
<script>window.addEventListener('error',e=>{window.err=String(e.message);console.log('ERR '+e.message)});</script>
<script type="module">
import * as T from './toon.js';
const c = document.getElementById('c'), g = c.getContext('2d');
g.fillStyle = '#cfd8dc'; g.fillRect(0, 0, 1200, 1000);
const people = [
  ['captain', { expr: 'stern', hat: 'captain' }], ['first', { expr: 'neutral' }],
  ['sarah', { expr: 'smile' }], ['girl', { expr: 'grin' }],
  ['sailor', { expr: 'nervous' }], ['sailorB', { expr: 'shock', L: 'cheek', R: 'cheek' }],
  ['sailorC', { expr: 'neutral', L: 'point' }], ['sailorD', { expr: 'pained', L: 'hip' }],
];
people.forEach(([k, o], i) => {
  g.save(); g.translate((i % 4) * 300, Math.floor(i / 4) * 500); g.scale(0.5, 0.5);
  g.strokeStyle = '#8fa0a8'; g.lineWidth = 3; g.strokeRect(0, 0, 600, 1000);
  try { T.seaFront(new T.Pen(g), k, { seed: i + 3, ...o }); } catch (e) { console.log('ERR ' + k + ' ' + e.message); }
  g.restore();
});
window.ready = true;
</script></body></html>
